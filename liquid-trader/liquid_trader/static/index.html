<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Trader</title>
<link rel="stylesheet" href="/static/app.css">
<script>window.TOKEN = "__TOKEN__";</script>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5C8 8 5.5 11.4 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 11.4 16 8 12 2.5z"/><path d="M9 15.5l2 -2 2 1.5 2.5 -3"/></svg></div>
    <button class="navbtn active" data-view="trade" title="Trade (1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M9 19V5M14 19v-7M19 19V8"/></svg>Trade</button>
    <button class="navbtn" data-view="bots" title="Bots (2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></svg>Bots</button>
    <button class="navbtn" data-view="backtest" title="Backtest (3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4M12 8v4l3 2"/></svg>Backtest</button>
    <button class="navbtn" data-view="tools" title="Tools (4)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2M16 11v4"/></svg>Tools</button>
    <div class="spacer"></div>
    <button class="navbtn" data-view="settings" title="Settings (5)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>

  <header class="topbar">
    <div class="symsel" id="symsel"><span id="sym-name">BTC-PERP</span><span class="chev">▼</span>
      <div class="dropdown" id="symdrop"><input class="search" id="symsearch" placeholder="Search markets…"><div class="list" id="symlist"></div></div>
    </div>
    <div class="tstats">
      <div class="tstat big"><span class="k">Mark</span><span class="v" id="t-price">–</span></div>
      <div class="tstat"><span class="k">24h change</span><span class="v" id="t-chg">–</span></div>
      <div class="tstat"><span class="k">24h volume</span><span class="v" id="t-vol">–</span></div>
      <div class="tstat"><span class="k">Funding / 1h</span><span class="v" id="t-fund">–</span></div>
    </div>
    <div class="right">
      <div class="tstat" style="text-align:right"><span class="k">Equity</span><span class="v" id="t-eq">–</span></div>
      <span class="pill" id="always-pill" title="24/7 background service" style="display:none">⏱ 24/7</span>
      <span class="pill" id="src-pill" title="Data source"><span class="dot sim" id="src-dot"></span><span id="src-name">Simulated</span></span>
      <button class="kill" id="killbtn" title="Stop every bot and flatten their positions">KILL SWITCH</button>
    </div>
  </header>

  <main class="main">
    <!-- ================= TRADE ================= -->
    <section class="view active" id="view-trade">
      <div class="col wl">
        <div class="panel watch">
          <div class="panel-h">Markets <span class="r sub" id="wl-count"></span></div>
          <input class="search" id="wlsearch" placeholder="Filter…">
          <div class="scroll" id="watchlist"></div>
        </div>
      </div>
      <div class="col">
        <div class="panel chartwrap">
          <div class="toolbar">
            <div class="seg" id="intervals"></div>
            <span class="tsep"></span>
            <div class="seg" id="ctype"><button data-m="candle" class="on">Candles</button><button data-m="line">Line</button></div>
            <span class="tsep"></span>
            <div id="indchips" style="display:flex;gap:4px;flex-wrap:wrap"></div>
          </div>
          <div class="chart" id="chart"><div class="legend" id="legend"></div></div>
        </div>
        <div class="panel bottom">
          <div class="tabs" id="btabs">
            <button class="tab on" data-t="positions">Positions <span class="badge" id="b-pos">0</span></button>
            <button class="tab" data-t="symbots">Bots <span class="badge" id="b-bots">0</span></button>
            <button class="tab" data-t="fills">Recent fills</button>
            <button class="tab" data-t="activity">Activity</button>
          </div>
          <div class="scroll" id="bpane" style="flex:1"></div>
        </div>
      </div>
      <div class="col">
        <div class="panel ticket">
          <div class="panel-h">Order <span class="r"><span class="tag" id="ticket-mode">paper</span></span></div>
          <div class="panel-b">
            <div class="sides"><button class="sidebtn buy on" data-s="buy">Long / Buy</button><button class="sidebtn sell" data-s="sell">Short / Sell</button></div>
            <div class="seg" id="otype" style="margin-bottom:10px;width:100%"><button data-o="market" class="on" style="flex:1">Market</button><button data-o="limit" style="flex:1">Limit</button></div>
            <div class="field" id="limitfield" style="display:none"><label>Limit price</label><input class="input num" id="o-price" type="number" step="any"></div>
            <div class="field"><label>Size (USD) <span id="o-coin" class="dim"></span></label><input class="input num" id="o-usd" type="number" value="100" min="10" step="10"></div>
            <div class="quick" style="margin:-4px 0 10px"><button data-q="50">$50</button><button data-q="100">$100</button><button data-q="250">$250</button><button data-q="500">$500</button><button data-q="1000">$1k</button></div>
            <div class="field"><label>Leverage <b id="o-levv">3x</b></label><input type="range" id="o-lev" min="1" max="50" value="3"></div>
            <div class="row2"><div class="field"><label>Take profit</label><input class="input num" id="o-tp" type="number" step="any" placeholder="price"></div>
              <div class="field"><label>Stop loss</label><input class="input num" id="o-sl" type="number" step="any" placeholder="price"></div></div>
            <div class="kv"><span>Margin required</span><span id="o-margin">–</span></div>
            <div class="kv"><span>Est. liquidation</span><span id="o-liq">–</span></div>
            <div class="kv" style="margin-bottom:10px"><span>Est. fee</span><span id="o-fee">–</span></div>
            <button class="btn buy block" id="o-submit">Buy BTC</button>
          </div>
        </div>
        <div class="panel" style="flex:1">
          <div class="panel-h">Order book <span class="r sub" id="ob-sym"></span></div>
          <div class="bhead"><span>Price</span><span>Size</span><span>Total $</span></div>
          <div class="book scroll" id="book"></div>
        </div>
      </div>
    </section>

    <!-- ================= BOTS ================= -->
    <section class="view" id="view-bots">
      <div>
        <div class="pagehead"><h1>Trading bots</h1><span class="muted" id="bots-sub"></span>
          <div class="r"><button class="btn danger sm" id="stopall">Stop all</button><button class="btn primary" id="newbot">+ New bot</button></div></div>
        <div class="stats" style="margin-top:14px" id="botstats"></div>
      </div>
      <div class="botgrid" id="botgrid"></div>
    </section>

    <!-- ================= BACKTEST ================= -->
    <section class="view" id="view-backtest">
      <div class="panel">
        <div class="panel-h">Backtest a strategy</div>
        <div class="panel-b" id="btform"></div>
      </div>
      <div class="results" id="btresults">
        <div class="stats" id="btstats"></div>
        <div class="panel btcharts"><div class="panel-h">Equity curve <span class="sub">strategy vs. buy &amp; hold</span></div><div class="chart" id="bt-eq"></div></div>
        <div class="panel btcharts"><div class="panel-h">Trades on price <span class="sub" id="bt-range"></span></div><div class="chart" id="bt-price"></div></div>
        <div class="panel" style="max-height:300px"><div class="panel-h">Fills</div><div class="scroll" id="bt-fills"></div></div>
      </div>
    </section>

    <!-- ================= TOOLS ================= -->
    <section class="view" id="view-tools"></section>

    <!-- ================= SETTINGS ================= -->
    <section class="view" id="view-settings"></section>
  </main>
</div>

<aside class="drawer" id="drawer"></aside>
<div class="modal-bg" id="modalbg"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script src="/static/chart.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
